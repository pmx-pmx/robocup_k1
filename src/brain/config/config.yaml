brain_node:
  ros__parameters:
    game:
      team_id: 152 # consistant with GameControl
      player_id: 1 # 1 | 2 | 3 | 4 | 5
      field_type: "adult_size" # adult_size | kid_size | robo_league
      player_role: "goal_keeper" # striker | goal_keeper
      player_start_pos: "right" # right | left
      treat_person_as_robot: false # 是否将人类视为机器人, 用于调试. !!!! 正式比赛时, 必须设置为 false !!!!
      number_of_players: 3
    
    ball_predictor: 
      step_interval: 100. 
      step_cnt: 50 
      acceleration: -0.35
      speed_friction_factor: 0.45
      
    robot:
      robot_height: 0.90 
      odom_factor: 1.0 
      vx_factor: 0.90 
      yaw_offset: 0.0 
      vx_limit: 3.0
      vy_limit: 1.5
      vtheta_limit: 1.8 

    strategy:
      ball_confidence_threshold: 60.0 
      ball_confidence_decay_rate: 3.0 
      enable_stable_kick: false 
      ball_memory_timeout: 3.0 
      ball_lost_msecs: 1000.0
      tm_ball_dist_threshold: 1.5  
      limit_near_ball_speed: true
      near_ball_speed_limit: 0.6 
      near_ball_range: 2.0  #2.0
      kickoff_hold_opponent: false  # 对方开球时是否移动到前场待命点；false 时 Ball Free 后直接找球
      soft_kickoff: false  #true          # 所有开球(比赛开球/任意球/角球/门球)均用软速度，降低出界/失误风险
      soft_kickoff_speed: 0.3
      non_direct_restart:
        ball_move_threshold: 0.25  # 角球/边线球第一脚确认球已离开起点的距离 (m)
        timeout_ms: 12000.0         # 视觉异常时释放第一脚保护的最长时间 (ms)
      kick_range: 1.0 
      kick_theta_range: 0.2 
      abort_kick_when_ball_moved: true 
      abort_kick_ball_move_threshold: 0.3 
      abort_shoot_when_ball_moved: true  
      limit_speed_near_border: false 
      near_border_speed_limit: 0.5
      near_border_dist_threshold: -1.0 
      enable_bypass: false 
      enable_shoot: false 
      enable_directional_kick: false 
      goalie_visual_kick_cooldown_ms: 900.0
      goalie_visual_kick_max_ball_range: 3.5
      goalie_visual_kick_max_direction_error: 0.9 # 守门员启动视觉踢球前，球方向与解围方向的最大误差(rad)
      goalie_simple_x_kp: 0.9
      goalie_simple_y_kp: 2.2
      goalie_simple_threat_vxf: -0.08
      goalie_simple_predict_min_vxf: 0.10
      goalie_simple_t_goal_max: 8.0
      goalie_simple_t_plane_min: 0.02
      goalie_simple_t_plane_max: 6.0
      goalie_simple_vy_max: 0.8
      goalie_simple_vx_max: 1.2
      goalie_simple_vtheta_kp: 1.4
      goalie_simple_vtheta_limit: 1.5
      shoot:
        threat_threshold: -2.0 
        xmin: 0.3
        xmax: 0.6
        ymin: -0.3
        ymax: 0.3

      power_shoot:
        enable: true 
        use_for_kickoff: false 
        xmin: 0.2 
        xmax: 1.0 
        ymin: -0.3 
        ymax: 0.3 
      enable_auto_visual_kick: true
      auto_visual_kick_enable_dist_min: 0.05 # 避免将本体的部分识别为球
      auto_visual_kick_enable_dist_max: 5.0
      auto_visual_kick_enable_angle: 2.0 # 放宽球的角度限制（原 1.5 rad），允许球在更大范围的侧面角度也能踢球
      auto_visual_kick_max_direction_error: 2.5 # 放宽踢球方向偏差容忍（原 1.8 rad），减少绕圈 Adjust 时间
      auto_visual_kick:
        real_ball_hold_ms: 1000.0
        current_real_ball_max_age_ms: 650.0
        near_ball_memory_reject_range: 0.45
        allow_predicted_kick_msg: true
        allow_memory_kick_msg: true
        kick_msg_real_ball_max_age_ms: 650.0
        no_detection_kick_msg_reject_range: 0.45
        startup_decelerate_ms: 40.0 #80.0
        exit_decelerate_ms: 140.0
        max_parallel_count: 1
        yield_my_cost_min: 4.0
        no_progress_timeout_ms: 3500.0
        progress_range_delta: 0.12
        progress_ball_forward_delta: 0.15
        max_total_ms: 14000.0
        max_extra_rounds: 1
      visual_kick_spacing:
        enable: true             # 视觉踢球时，另一名前锋执行让位和距离保持
        target_distance: 1.5     # 接应位到视觉踢球主攻手的目标距离 (m)
        yield_distance: 1.5      # 小于此距离时，接应前锋主动远离主攻手 (m)
        release_distance: 2.0    # 达到此距离后解除强制让位速度 (m)
        stop_distance: 1.0       # 小于此距离时禁止继续向主攻手靠近 (m)
        peer_fresh_ms: 500.0     # 队友视觉踢球状态允许的最大通信延迟 (ms)
        yield_speed: 1.0         # 让位/接应移动速度上限 (m/s)
      global_collision_avoidance:
        enable: true                    # 全局队友防碰撞开关
        min_distance: 0.6               # 硬性最小距离限制 (m)，任意队友距离 < 此值时强制远离
        safe_distance: 1.2              # 安全距离 (m)，距离 < 此值时开始减速
        stop_distance: 0.4              # 紧急停止距离 (m)，距离 < 此值时立即停止移动
        speed_reduction_factor: 0.5     # 安全区内的速度衰减系数（0-1）
        teammate_comm_timeout_ms: 1000.0 # 队友位置信息有效期 (ms)
      cooperation:
        enable_role_switch: false 
        ball_control_cost_threshold: 5.0 
        goalie_comm_fresh_msecs: 2200.0
        goalie_comm_stable_msecs: 1000.0
        goalie_distance_tie_margin: 0.15
        goalie_fallback_use_gc_goalie: true # 通信暂时不完整时优先沿用裁判机守门员，避免错误球员跑向门前
        goalie_attack_handoff: false  #true
      far_set_play_search:
        enable: true                 # 任一方门球/角球很远且看不到球时，先去球应出现的半场搜索
        trigger_x: 0.5               # 越过中线至少 0.5 m 才算进入目标半场，避免在中线附近反复切换
        field_target_x_ratio: 0.25   # 场上机器人搜索目标 |x| = 场长 * 此比例
        lane_y_ratio: 0.28           # 按 player_id 分配横向搜索通道
        max_move_secs: 30.0
        vx_limit: 0.7
        vy_limit: 0.4
      set_play_stand:
        corridor_half_width: 0.6     # 我方角球/门球时，判断是否挡住开球通道的半宽 (m)
        corridor_forward_range: 3.0  # 开球通道沿 kickDir 方向的有效长度 (m)
        side_margin: 0.2             # 让位时在通道边缘外再留出的余量 (m)

    obstacle_avoidance:
      depth_sample_step: 16 
      obstacle_min_height: 0.3 
      grid_size: 0.2 
      max_x: 3.0 
      max_y: 5.0 
      exclusion_x: 0.4 
      exclusion_y: 0.5 
      ball_exclusion_radius: 0.0 
      ball_exclusion_height: 0.3 
      occupancy_threshold: 20 
      collision_threshold: 0.3 
      safe_distance: 1.0 
      avoid_secs: 2.0 
      enable_freekick_avoid: true 
      freekick_start_placing_safe_distance: 0.5 
      freekick_start_placing_avoid_secs: 1.5 
      obstacle_memory_msecs: 600.0 #500.0 
      avoid_during_kick: false  #false
      kick_ao_safe_dist: 2.0  #1.5  
      kick_ao_use_shoot: false 
      avoid_during_chase: false  #false
      chase_ao_safe_dist: 3.0    #1.5
      always_turn_left: false  #false 

    RLVisionKick:
      visual_kick_version: kV2 # kV1 | kV2 修改此参数可更改visualkick调用版本
      goalie_clearance_power: 5.0
      kickoff_power: 6.0 # 我方比赛开球时 rank 0 前锋的视觉踢球距离
      kick_direction_offset_left: 0.3   # 左脚踢球方向补偿（球在左侧，y>0），正值向左（修正偏右），单位：弧度（0.1 rad ≈ 5.7度）
      kick_direction_offset_right: -0.3 # 右脚踢球方向补偿（球在右侧，y<0），负值向右（修正偏左），单位：弧度（-0.1 rad ≈ -5.7度）

    locator:
      min_marker_count: 4 #4
      max_residual: 0.50

    enable_com: True  # 是否开启队友间通信，建议打开

    rerunLog:
      enable_tcp: false # 是否通过网络传输 log
      server_ip: "192.168.10.110:9876" # 开启了 rerun Viewer 的机器地址
      enable_file: true # 是否将 log 写入本地,加入默认扫场
      log_dir: "/home/booster/Workspace/rrlog" # 本地 log 存储路径, 会在此路径下生成以时间为开头的文件
      max_log_file_mins: 5.0 # 本地 log 最长多少分钟就分片存储. 太大的文件会导致读的时候死机.
      img_interval: 1 #每多少帧图像 log 一次, 如果希望更好的实时性或减少日志大小, 可以调高这个值. 但会造成 log 的时间精度降低.
    
    recovery:
      retry_max_count: 2
      get_up_version: kV2 # kV1 | kV2

    vision:
      image_topic: "/boostercamera/head/rgb" #相机topic统一命名，topic名称不需更改
      depth_image_topic: "/boostercamera/head/depth" #相机topic统一命名，topic名称不需更改
      cam_pixel_width: 544. # 相机像素宽度, d-robotics
      cam_pixel_height: 448. # 相机像素高度, d-robotics

      #cam_pixel_width: 1280. # 相机像素宽度 realsense
      #cam_pixel_height: 720. # 相机像素高度 realsense
      #cam_fov_x: 90.0 # 相机视场角, 单位: 度 realsense
      #cam_fov_y: 60.0 # 相机视场角, 单位: 度 realsense

      cam_fov_x: 69.4 # 相机视场角, 单位: 度, d-robotics,debug
      cam_fov_y: 42.5 # 相机视场角, 单位: 度, d-robotics,debug  
      # Unit: rad. The current software limit is +/-1.1 rad (+/-63.0 deg).
      # Increase only after verifying the physical gimbal limit on the robot.
      head_yaw_limit_left: 1.3
      head_yaw_limit_right: -1.3
      # Search endpoints are bounded by the yaw limits during startup.
      head_scan_yaw_left: 1.3
      head_scan_yaw_right: -1.3

    debug:
      log_ball_pos: false # 是否记录球位置到 ballpos.log 中, 用于调试
      low_frequency_status:
        enable: true # 低频输出机器人位姿、球状态、比赛状态和 ASCII 场地图
        mode_enable: true # 通过 LocoApi GetMode(2017) 异步查询当前机器人模式
        field_ascii_enable: true # 输出按场地坐标绘制的 ASCII 场地图
        log_interval_ms: 2000.0 # 位姿/球/比赛状态摘要间隔
        mode_query_interval_ms: 2000.0 # SDK mode 查询间隔
        mode_query_timeout_ms: 1000.0 # 单次 SDK mode 查询超时
        field_ascii_interval_ms: 5000.0 # ASCII 场地图输出间隔
        field_ascii_char_aspect: 2.0 # 终端字符高宽比修正
        field_ascii_width: 45 # ASCII 场地图内部宽度
    
    game_control_ip: "192.168.50.12"  # 更改为具体的裁判机的 IP 地址

    # for fun
    sound:
      enable: true 
      sound_pack: "espeak" 
